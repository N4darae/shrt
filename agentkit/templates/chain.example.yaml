apiVersion: shrt/v1
name: example
description: "REPLACE_ME: the state this chain reproduces"

vars:
  thing_name: REPLACE_ME_NAME

steps:
  - id: create_thing
    call: REPLACE_ME.package.v1.REPLACE_MEService/CreateThing
    body:
      REPLACE_ME_NAME_FIELD: ${vars.thing_name}
      idempotency_key: ${uuid}
    expect:
      - path: error.code
        equals: OK
      - path: REPLACE_ME_ID_FIELD
        not_empty: true
    export:
      thing_id: REPLACE_ME_ID_FIELD

  - id: fetch_thing
    call: REPLACE_ME.package.v1.REPLACE_MEService/FetchThing
    body:
      REPLACE_ME_ID_FIELD: ${create_thing.REPLACE_ME_ID_FIELD}
    expect:
      - path: error.code
        equals: OK
      - path: REPLACE_ME_NAME_FIELD
        equals: ${vars.thing_name}
